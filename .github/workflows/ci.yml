name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ohne diesen Block erbt der Job-Token die Repo-Vorgabe — je nach
# Einstellung schreibend auf Inhalte, Issues und Pull Requests. CI baut und
# testet nur; sie braucht davon nichts. Der Version Guard liest die
# Historie, mehr passiert hier nicht.
permissions:
  contents: read

# Ein überholter Push auf einen Feature-Branch bricht seinen Vorgänger ab;
# Läufe auf main bleiben unangetastet (sie speisen die Release-Pipeline).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Ohne Version-Bump in pubspec.yaml legt release.yml kein Tag an — eine
  # Änderung an der App käme dann nie auf den Geräten an. Im PR bleibt das
  # eine Warnung (der Bump darf bis kurz vor dem Merge fehlen), auf main
  # ist es ein Fehler, weil dort niemand mehr gegensteuert.
  version-guard:
    name: Version Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify pubspec version bump
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manueller Lauf ohne Vergleichsbasis — übersprungen." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "Kein brauchbarer Vergleichs-Commit (Erst- oder Force-Push) — übersprungen." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          version_at() {
            git show "$1:pubspec.yaml" 2>/dev/null |
              sed -n 's/^version:[[:space:]]*\(.*\)/\1/p' | tr -d '[:space:]'
          }

          # Nur diese Pfade landen im ausgelieferten Build. Doku, Tests, CI,
          # tool/-Skripte und Server-Migrationen brauchen keinen Bump.
          shipping=$(git diff --name-only "$BASE_SHA" HEAD -- \
            lib android ios macos web assets pubspec.yaml pubspec.lock)

          base_version=$(version_at "$BASE_SHA")
          head_version=$(version_at HEAD)

          if [[ -z "$shipping" ]]; then
            verdict="✅ Keine ausgelieferten Dateien geändert — kein Version-Bump nötig."
            status=ok
          elif [[ -n "$head_version" && "$head_version" != "$base_version" ]]; then
            verdict="✅ Version gebumpt: \`$base_version\` → \`$head_version\`"
            status=ok
          else
            verdict="⚠️ Ausgelieferte Dateien geändert, aber \`version:\` steht unverändert auf \`$head_version\`. Ohne Bump erzeugt release.yml kein Tag und kein APK."
            status=missing
          fi

          {
            echo "### Version Guard"
            echo ""
            echo "$verdict"
            if [[ -n "$shipping" ]]; then
              echo ""
              echo "<details><summary>Geänderte ausgelieferte Dateien</summary>"
              echo ""
              echo '```'
              echo "$shipping"
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$status" == ok ]]; then
            echo "$verdict"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "::warning file=pubspec.yaml::${verdict//\`/}"
            exit 0
          fi
          echo "::error file=pubspec.yaml::${verdict//\`/}"
          exit 1

  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Guard against stale committed codegen (.g.dart / .freezed.dart).
      - name: Verify generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code || {
            echo "::error::Generated files are stale. Run 'dart run build_runner build' and commit the result."
            exit 1
          }

      # The VM's autodeploy (issue #74) reads deploy/manifest.json via
      # raw.githubusercontent.com — a stale manifest means new migrations
      # silently never reach production.
      - name: Verify deploy manifest is up to date
        run: python3 tool/generate_deploy_manifest.py --check

      - name: Analyze
        run: flutter analyze

      # Edge Functions ship via the VM's autodeploy on merge (issue #74) and
      # have no compile step of their own — a syntax error surfaces only as a
      # function that never boots, so every invocation hangs until the gateway
      # times out (happened live: v1.9.0 broke the user management screen
      # with a missing '+' between two string literals).
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Check Edge Functions
        run: deno check supabase/functions/*/index.ts

      # Local Supabase stack so the sync E2E test runs (it self-skips
      # without one, which would drop coverage below the gate).
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          # ⚠️ NICHT `latest`. Am 2026-08-26 um 19:51 erschien CLI v2.116.0;
          # der nächste CI-Lauf zog sie und ließ zwei RLS-Zusicherungen
          # umkippen (`branding_e2e_test`, `profil_e2e_test`) — auf
          # unverändertem `main`, ohne dass jemand etwas committet hatte.
          # Der Stack, den `supabase start` hochzieht, ist eine Abhängigkeit
          # wie jede andere; dieses Repo pinnt jede Action per SHA, und für
          # den Stack darunter gilt dasselbe. Beim Anheben: erst prüfen, ob
          # die Integrationstests noch grün sind, siehe Issue #185.
          version: 2.115.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Create sync test users
        run: bash tool/setup_local_supabase.sh

      - name: Test (with coverage)
        run: flutter test --coverage

      - name: Coverage gate (logic layers ≥ 65%)
        run: dart run tool/check_coverage.dart --min 65

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - run: flutter pub get
      - run: flutter build web --release

      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - run: flutter pub get

      # Ein einzelnes arm64-APK reicht: deckt praktisch jedes Android-Gerät
      # ab ca. 2017 ab.
      - run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
