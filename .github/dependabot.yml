version: 2

# Monatlich statt wöchentlich: Das Projekt hat einen Solo-Maintainer, und
# jeder PR kostet hier einen kompletten CI-Durchlauf inklusive Android-Build.
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    # Ein Sammel-PR statt einer pro Paket: Jedes pub-Update zieht die ganze
    # pubspec.lock mit (inkl. Codegen-Paketen), danach stimmt der committete
    # build_runner-Output nicht mehr und der Staleness-Guard schlägt in jedem
    # Einzel-PR fehl (2026-07: #44–#48, sogar beim path_provider-Patch-Bump).
    # Der Sammel-PR braucht trotzdem Handarbeit: Codegen frisch laufen lassen,
    # generierte Dateien committen, Version bumpen.
    groups:
      dart:
        patterns:
          - "*"
    # Dependabot-PRs fassen pubspec.yaml/lock an — das sind ausgelieferte
    # Pfade. Der Version Guard warnt dort also; der Bump gehört wie bei jeder
    # anderen ausgelieferten Änderung zum Merge dazu. Das ist gewollt.
    #
    # Diese beiden kann Dependabot NICHT allein richtig anheben (belegt an PR
    # #88, 2026-08-02, lokal nachgestellt). Der Sammel-PR war dadurch als
    # Ganzes unbrauchbar: Ein einziges nicht anhebbares Paket macht die
    # Gruppe rot, die brauchbaren Updates darin kommen nicht durch.
    #
    # ⚠️ Eine `ignore`-Regel hält innerhalb eines `groups:`-Updates NICHT
    # zuverlässig: pub löst die ganze Lockfile auf einmal auf und zieht
    # gekoppelte Pakete mit. #196 schlug 2026-09-01 genau die beiden Majors
    # vor, die hier verboten sind. Für den Einzelfall wirkt der
    # Kommentarbefehl `@dependabot ignore <paket> major version` am PR
    # (umkehrbar mit `@dependabot unignore`).
    #
    # drift/drift_dev standen hier bis #199 ebenfalls, exakt gepinnt wegen
    # analyzer ^13. freezed 4 verlangt analyzer ^14 und hat den Grund damit
    # aufgelöst; beide stehen jetzt auf Caret-Bereichen, die pub von selbst
    # zusammenhält, und brauchen keine Ausnahme mehr.
    ignore:
      # ⚠️ Dependabot schlägt hier VORABVERSIONEN vor: In #88 kam
      # `^12.0.0-beta.7`, während pub.dev 11.0.3 als `latest` führte. Eine
      # Beta gehört nicht in eine ausgelieferte App, und das kann Dependabot
      # nicht wissen — deshalb bleibt diese Regel auch nach dem Umstieg auf
      # 13.1.0 (#199) stehen.
      #
      # Ein Major ist hier ohnehin Handarbeit: 13 hat das Paket föderiert
      # aufgeteilt (android_file_picker, file_picker_darwin/_linux/_web …)
      # und die Auswahl-API umgestellt — `pickFiles` gibt jetzt direkt eine
      # `List<PlatformFile>` zurück, `withData`/`.bytes` sind durch
      # `readAsBytes()` ersetzt (3 Stellen, alle im Import-Weg).
      - dependency-name: "file_picker"
        update-types: ["version-update:semver-major"]
      # Gekoppelt an file_picker über win32: 10.x verlangt win32 ^6, den
      # file_picker erst ab 12 liefert. Seit #199 sind beide dort. Die
      # Kopplung selbst bleibt und Dependabot sieht sie nicht — der nächste
      # Major gehört wieder zusammen mit file_picker angehoben.
      - dependency-name: "package_info_plus"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

# Bewusst NICHT aktiviert: package-ecosystem "gradle". Die Android-Seite eines
# Flutter-Projekts zieht ihre Versionen groesstenteils aus dem Flutter-SDK
# (compileSdk/minSdk/targetSdk kommen aus flutter.*Version). Dependabot sieht
# davon nur AGP und Kotlin und schlaegt dort gern Spruenge vor, die das
# Flutter-Gradle-Plugin noch nicht vertraegt. Diese beiden Versionen werden
# stattdessen beim Flutter-Upgrade von Hand mitgezogen.
