# fwapp-web-nginx.conf – nginx vor der Web-App und als API-Einstieg.
#
# Liegt auf der VM unter ~/fwapp-web/nginx.conf (read-only in den Container
# gemountet). Im Repo, weil eine Konfiguration, die NUR auf der VM lebt,
# genau die Sorte Einstellung ist, an der schon dreimal etwas still kaputt
# ging (Issue #118).
#
# ⚠️ DIE CACHE-REGELN SIND DER HEIKLE TEIL. Eine frühere Fassung cachte
# „alles andere" sieben Tage lang mit der Begründung „gehashte Assets" — das
# ist bei Flutter Web schlicht FALSCH: **kein einziger Dateiname eines
# Flutter-Web-Builds trägt einen Inhalts-Hash.** `main.dart.js` heißt in
# jedem Build gleich, `assets/…` ebenso. Die Folge war, dass fünf
# Veröffentlichungen (v1.19.0 bis v1.24.0) die Nutzer nie erreichten: Der
# Server hatte den neuen Stand, Cloudflare lieferte sieben Tage lang den
# alten, und `version.json` meldete brav die neue Version — die
# Aktualisierungs-Meldung erschien also, das Neuladen brachte aber wieder
# dieselbe alte App.
#
# Deshalb jetzt: **alles revalidieren.** `no-cache` heißt nicht „nicht
# speichern", sondern „vor jeder Benutzung nachfragen"; nginx antwortet über
# ETag mit 304, der Datenverkehr bleibt also klein und ein neuer Stand ist
# sofort da. Das ist der einzige Weg, der ohne Inhalts-Hashes im Dateinamen
# verlässlich ist.
#
# ⚠️ Nach einer Änderung an dieser Datei bleibt der ALTE Stand trotzdem im
# Cloudflare-Cache, bis dessen TTL abläuft — einmal „Purge Everything" im
# Cloudflare-Dashboard ist danach nötig. Ab dann nie wieder.

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/html text/css application/javascript application/json application/wasm image/svg+xml;

  # Supabase-API (Kong) unter demselben Einstieg bereitstellen: nur die von der
  # App genutzten Pfade. Studio/Meta bleiben so von außen unerreichbar.
  # Kong-IP dynamisch aufloesen (Docker-DNS), sonst zeigt nginx nach einer
  # Neuerstellung des Kong-Containers (compose pull/up) auf die alte IP -> 502.
  resolver 127.0.0.11 valid=30s ipv6=off;
  location ~ ^/(auth|rest|storage|functions)/ {
    set $kong_upstream http://supabase-kong:8000;
    proxy_pass $kong_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 25m;
    proxy_read_timeout 120s;
  }

  # Alles revalidieren (siehe Kopfkommentar). Kein Dateiname eines
  # Flutter-Web-Builds ist inhaltsabhängig, also darf nichts blind aus dem
  # Cache kommen. ETag sorgt dafür, dass Unverändertes ein 304 bleibt.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
