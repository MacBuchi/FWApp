<?xml version="1.0" encoding="UTF-8"?>
<!-- FWApp app icon: Feuerwehrhelm mit Prüf-Abzeichen auf Feuerrot (#C62828).
     Vollflächig quadratisch; die Plattformen maskieren ihre eigenen Ecken.

     ⚠️ Flach, ohne Verlauf und ohne Flamme (Issue #175). Die alte Fassung —
     weiße Flamme auf rotem Verlauf — war von der Tinder-Marke kaum zu
     unterscheiden.

     ⚠️ Die Aussparungen (Stirnschild, Ring, Haken) sind in der
     HINTERGRUNDFARBE gemalt, nicht ausgestanzt. Das ist Absicht und hat eine
     Bedingung: #C62828 muss `adaptive_icon_background` in pubspec.yaml
     entsprechen. Wer den Grund ändert, ändert ihn an beiden Stellen —
     sonst stehen rote Reste in einem andersfarbigen Icon.

     Der Faktor 0,94 ist Luft für die maskierbare PWA-Fassung: Die erzeugt
     flutter_launcher_icons aus DIESER Datei, ohne eigenen Rand, und ein
     runder Zuschnitt knabberte sonst an der Krempe. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#C62828"/>
  <g transform="translate(512 512) scale(0.94) translate(-546 -609)">
  <!-- Helm, Frontansicht: Kuppel, beidseitige Krempe, Stirnschild. Das
       Stirnschild ist das Zeichen, an dem man den Feuerwehrhelm vom Bauhelm
       unterscheidet. -->
  <path fill="#FFFFFF" d="
    M 152,704 C 140,652 176,616 268,604
    C 260,400 360,280 512,280
    C 664,280 764,400 756,604
    C 848,616 884,652 872,704 Z"/>
  <path fill="#C62828" d="
    M 424,396 C 480,376 544,376 600,396
    C 604,496 576,564 512,600
    C 448,564 420,496 424,396 Z"/>
  <!-- Abzeichen: geprüft. Es sitzt an der UNTERKANTE der Krempe, nicht an
       ihrer Rundung — dort stieß die Krempe sonst als Sporn aus dem Ring. -->
  <circle cx="820" cy="806" r="132" fill="#C62828"/>
  <circle cx="820" cy="806" r="104" fill="#FFFFFF"/>
  <path fill="#C62828" d="
    M 768,792 L 806,830 L 874,750 L 892,768 L 806,858 L 750,802 Z"/>
  </g>
</svg>
