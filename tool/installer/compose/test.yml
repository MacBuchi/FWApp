# compose/test.yml – NUR für den Nachweis in der Entwicklung (#241).
#
# Legt den vom Installer gebauten Server auf die Ports des lokalen
# Supabase-Stacks (API 54321, Mailpit 54324) — dann laufen alle E2E-Tests
# aus test/integration/ unverändert gegen ihn. Der Installer schreibt dafür
# die Demo-Schlüssel des lokalen Stacks in die .env. Nie produktiv benutzen.
services:
  kong:
    ports:
      - "54321:8000"
  # Docker Desktop reicht Verzeichnisse vom Mac ohne erweiterte
  # Dateiattribute durch; Storage speichert darin den Inhaltstyp und
  # scheitert mit „does not support extended attributes". Auf ext4 (Pi, VM)
  # gibt es das nicht — nur der Nachweis am Mac braucht ein Docker-Volume.
  storage:
    volumes:
      - storage-test:/var/lib/storage
  mailpit:
    container_name: fwapp-mailpit
    image: public.ecr.aws/supabase/mailpit:v1.30.2
    ports:
      - "54324:8025"
      # SMTP für fwapp_update.py: Er läuft auf dem Rechner, nicht im
      # Docker-Netz, und schickt dem KreisDatenMeister die Fehler-Mail.
      - "54325:1025"

volumes:
  storage-test:
