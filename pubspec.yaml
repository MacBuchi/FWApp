name: fwapp
description: Feuerwehr-Lernapp – Fahrzeuge, Geräte, Beladepläne und Trainings-Spielmodi.
publish_to: 'none'

version: 1.51.1+80

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0

  # Local database
  #
  # Paar-Paket mit drift_dev unten: beide MUESSEN dieselbe Version haben,
  # sonst bricht test/core/database/migration_test.dart beim Laden mit einem
  # Compile-Fehler (nicht mit einem Analyse-Fehler). Bis #199 standen beide
  # exakt auf 2.34.0, weil drift_dev ab 2.34.4 analyzer ^13 verlangte und die
  # Codegen-Kette dort nicht mitkam. Mit freezed 4 (analyzer ^14) hat sich das
  # von selbst erledigt — der Zwang ist jetzt umgekehrt, freezed 4 und
  # drift_dev 2.34.0 sind unvereinbar. Der Caret-Bereich reicht wieder, weil
  # pub das Paar von sich aus zusammenhaelt.
  drift: ^2.35.0
  # sqlite3 3.x liefert die nativen SQLite-Libs selbst ueber Build-Hooks.
  # sqlite3_flutter_libs ist damit hinfaellig (0.6.0+eol ist eine leere
  # Huelle) und wurde bewusst entfernt, nicht hochgezogen.
  sqlite3: ^3.6.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Navigation
  go_router: ^18.0.1

  # Domain models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # File handling / images
  file_picker: ^13.1.0
  # Öffnet eine LOKALE Datei mit dem Betrachter des Geräts (Issue #182).
  # `url_launcher` kann das auf Android nicht: Ein file://-URI wird seit
  # Android 7 abgelehnt, es braucht einen FileProvider — und genau den
  # bringt dieses Paket mit.
  open_filex: ^4.7.0
  image_picker: ^1.1.2
  cached_network_image: ^4.0.0
  # Nur wegen ImageRenderMethodForWeb (Issue #114): Die Aufzaehlung wird von
  # cached_network_image nicht re-exportiert, der Import braucht sie direkt.
  cached_network_image_platform_interface: ^5.0.0
  flutter_cache_manager: ^3.4.1
  image: ^4.3.0
  cross_file: ^0.3.4
  http: ^1.2.0

  # Codes scannen und anzeigen (Issues #177/#179).
  #
  # `mobile_scanner` bringt die Kamera mit — auf Android/iOS nativ, im
  # Browser über getUserMedia. Der Web-Pfad ist ein ANDERER als auf dem
  # Gerät (AGENTS.md, Kamera): Was im Browser läuft, ist kein Beleg für das
  # Handy, und umgekehrt.
  mobile_scanner: ^7.4.2
  # Nur zum Anzeigen eines vergebenen Codes zum Ausdrucken. Rendert nach
  # Widget, nicht nach Bilddatei — deshalb kein Pfad, keine Ablage.
  qr_flutter: ^4.1.0

  # Excel import
  excel: ^4.0.6

  # Cloud sync (optional)
  supabase_flutter: ^2.17.2

  # Localisation
  intl: ^0.20.2

  # Utilities
  logger: ^2.8.0
  # In-App-Update: lädt das Release-APK und öffnet den Android-Installer.
  ota_update: ^7.0.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  # Gekoppelt an file_picker ueber win32: 10.x verlangt win32 ^6, den
  # file_picker erst ab 12 liefert. Seit #199 sind beide dort, stabil und
  # ohne Beta. Die Kopplung bleibt bestehen — kuenftige Majors dieser
  # beiden gehoeren weiter zusammen angehoben.
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  # Teilen-Blatt des Systems (Issue #165): Zugangsdaten wandern damit in
  # WhatsApp, Signal oder SMS, statt abgetippt zu werden.
  share_plus: ^13.3.0
  csv: ^8.0.0
dev_dependencies:
  # Nur für den TOTP-E2E-Test: Er erzeugt die Sechsstelligen selbst
  # (HMAC-SHA1 nach RFC 6238), um die Zwei-Faktor-Anmeldung gegen den
  # echten Stack durchzuspielen. In der App wird nichts davon benutzt —
  # die Codes kommen dort aus der Authenticator-App des Nutzers.
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  # Geräte-Tests ("Test-API" statt Screenshot-Steuerung):
  # flutter test integration_test -d <geräte-id>
  integration_test:
    sdk: flutter
  # Nur für den Override-Typ im Test-Harness (riverpod/misc.dart).
  riverpod: ^3.0.0
  build_runner: ^2.4.14
  # Siehe die Begruendung bei `drift` oben — nur zusammen mit der
  # drift-Laufzeitversion anheben, sonst bricht der Migrationstest.
  drift_dev: ^2.35.0
  riverpod_generator: ^4.0.0
  # Bis #199 loeste das hier auf eine VORABVERSION auf (3.2.6-dev.1), weil
  # stabiles freezed 3.2.5 analyzer <11 deckelte und riverpod_generator
  # analyzer ^12 verlangte — es gab keine stabile Kombination. freezed 4
  # (analyzer ^14) macht die Kette wieder stabil; das war der eigentliche
  # Gewinn des Toolchain-Sprungs, nicht nur ein Versionssprung.
  freezed: ^4.0.2
  json_serializable: ^6.8.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# App-Icon (Quelle: assets/branding/*.svg, gerendert mit rsvg-convert).
# Neu ausrollen mit: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  # Muss dem Theme-Seed in lib/core/theme/app_theme.dart entsprechen.
  adaptive_icon_background: "#C62828"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/branding/app_icon_macos.png
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    theme_color: "#C62828"
    background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    # Wird in der App unter „Was ist neu?" gerendert (Issue #51) — die Datei
    # im Wurzelverzeichnis ist die einzige Quelle, kein zweiter Text im Code.
    - CHANGELOG.md
    - assets/equipment_library/metadata.json
    - assets/equipment_library/aliases.json
    - assets/equipment_library/catalog/standard_catalog.json
    - assets/equipment_library/vehicles/hlf20_demo/vehicle.json
    - assets/equipment_library/vehicles/hlf20_demo/loading_plan.json
    - assets/equipment_library/images/
    - assets/images/placeholder_equipment.png
    # Fragen und Aufgaben des Party-Modus (Issue #160). Bewusst ein
    # Asset: Der Topf lebt von Nachschub, und Nachschub soll keine
    # Code-Änderung kosten.
    - assets/game/party.json
    # Die Fragenbestände der Wissensdatenbank (Issue #174) — bundesweit
    # aus den Dienstvorschriften, je Land aus dem Landesrecht. Einzeln
    # gelistet, nicht als Verzeichnis: Die Dateien werden namentlich
    # geladen (kWissensAssets), und eine fehlende soll beim Build
    # auffallen statt erst als leeres Sachgebiet auf dem Gerät.
    - assets/knowledge/bund.json
    - assets/knowledge/abc.json
    - assets/knowledge/bw.json
    # Gefahrzettel und Warntafel zu den Fragen des ABC-Einsatzes. Anders als
    # die Fragendateien als VERZEICHNIS: Die Bilder werden nicht namentlich
    # aus dem Code geladen, sondern über den Pfad, der in der Frage steht —
    # ein fehlendes Bild fängt der Test ab, der jede Frage lädt.
    # Erzeugt von tool/generate_gefahrzettel.py, nicht von Hand.
    - assets/knowledge/bilder/
    # Fahrzeug-Vorlagen (Issue #55). Einzeln gelistet statt als Verzeichnis:
    # Ein Verzeichnis-Eintrag bündelt zwar alles, aber die Vorlagen werden
    # namentlich geladen (kBundledVehicleTemplateIds), und eine fehlende Datei soll
    # beim Build auffallen, nicht erst zur Laufzeit.
    - assets/vehicle_templates/lf10/template.json
    - assets/vehicle_templates/lf20/template.json
    - assets/vehicle_templates/hlf20/template.json
    - assets/vehicle_templates/tsf_w/template.json
    - assets/vehicle_templates/tlf3000/template.json
    - assets/vehicle_templates/tlf4000/template.json
    - assets/vehicle_templates/dlk23_12/template.json
    - assets/vehicle_templates/rw/template.json
    - assets/vehicle_templates/gw_l/template.json
    - assets/vehicle_templates/mtw/template.json
    - assets/vehicle_templates/elw1/template.json

