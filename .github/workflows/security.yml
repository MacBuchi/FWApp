name: Security

# Schwachstellen- und Lizenzprüfung über die Lockfiles.
#
# Der OSV-Lauf hat ZWEI Gesichter, und der Unterschied ist der ganze Punkt:
#
# 1. „OSV (PR)" scannt Ziel-Branch UND PR-Stand und meldet nur, was DIESER
#    PR neu einführt. Er darf deshalb blockieren: Eine frisch veröffentlichte
#    CVE in einer transitiven Abhängigkeit kann ihn konstruktionsbedingt
#    nicht rot färben — sie steht auf beiden Seiten des Vergleichs.
# 2. „OSV (wöchentlich)" scannt den Gesamtbestand. Er ist bewusst KEIN
#    Pflicht-Check und hängt an keinem PR: Genau dort würde eine alte CVE
#    ohne verfügbaren Fix jeden unbeteiligten PR blockieren, bis jemand
#    aufräumt. Als Wochenlauf meldet GitHub den Fehlschlag per Mail an den
#    Maintainer — das passt zum Solo-Betrieb und hält niemanden auf.
#
# Ergänzt Dependabot statt es zu ersetzen: Dependabot kann für `pub` auch
# Sicherheits-Updates, zieht seine Funde aber aus der GitHub Advisory
# Database, die für Dart dünn besetzt ist. OSV.dev führt deutlich mehr.
#
# `-r ./` bleibt als Standardargument stehen: Der Scanner findet
# pubspec.lock selbst und nimmt die Podfile.lock-Dateien gleich mit.

on:
  schedule:
    - cron: "17 5 * * 1" # montags früh
  pull_request:
  workflow_dispatch:

# Die Vorgabe für alle Jobs ist Lesen. `security-events: write` steht
# bewusst NICHT hier, sondern nur an den beiden OSV-Jobs, die es wirklich
# brauchen (SARIF-Upload nach Security → Code Scanning, im öffentlichen
# Repo kostenlos). Auf Workflow-Ebene bekämen es auch `dependency-review`
# und der Lizenz-Job — zwei Jobs, die Fremdcode aus dem pub-Cache anfassen
# und mit dem Recht Befunde im Sicherheits-Reiter fälschen könnten.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Darf blockieren. Nur neu eingeführte Funde, siehe Kopf.
  osv-scan-pr:
    name: OSV (PR)
    if: github.event_name == 'pull_request'
    # Genau die drei Rechte, die die aufgerufene Datei selbst deklariert.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8

  # Berichtend, nie blockierend, siehe Kopf.
  osv-scan-full:
    name: OSV (wöchentlich)
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8

  # Der Lizenz-Riegel auf dem PR-Diff. Prüft ausschließlich die NEU
  # hinzukommenden Abhängigkeiten (GitHubs Dependency Graph wertet
  # pubspec.yaml + pubspec.lock aus — Dart wird unterstützt, die Lockfile
  # ist eingecheckt).
  #
  # Bewusst eine DENY- und keine ALLOW-Liste: Eine Allowliste macht jede
  # unbekannte oder nicht auflösbare Lizenz zum Merge-Blocker, und genau das
  # passiert bei pub-Paketen regelmäßig. Verboten ist damit nur, was mit der
  # Auslieferung wirklich kollidiert.
  #
  # **VORBEDINGUNG, und sie ist eine Repo-Einstellung, kein Code:** Der
  # Dependency Graph muss unter Settings → Code security eingeschaltet sein
  # (https://github.com/MacBuchi/FWApp/settings/security_analysis). Ist er
  # aus, bricht dieser Job binnen Sekunden ab mit „Dependency review is not
  # supported on this repository" — so geschehen im ersten Lauf von
  # pilzbuddy #223. Das sieht nach einem kaputten Workflow aus und ist
  # keiner. Code Scanning kann dabei durchaus schon an sein: Der
  # SARIF-Upload von OSV lief im selben Lauf durch.
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0
          comment-summary-in-pr: never

  # Geheimnis-Suche über den Arbeitsbaum. Die Ausnahmen und ihre Begründung
  # stehen in `.gitleaks.toml` — dort ist auch nachgemessen, warum sie auf
  # EXAKTE Werte zielen und nicht auf Pfade: Ein Pfad-Allowlisting macht die
  # ganze Datei blind, ein echter Schlüssel darin wird dann nicht mehr
  # gemeldet (lokal nachgestellt, `condition = "AND"` rettet es nicht).
  #
  # Installiert wird die Release-Binärdatei mit **festgenagelter Version und
  # geprüfter Prüfsumme**, nicht über `gitleaks/gitleaks-action`: Die Action
  # verlangt für Organisationen eine Lizenz (`GITLEAKS_LICENSE`), und ein
  # Sicherheitsjob, der an einer fremden Lizenzprüfung hängen kann, ist ein
  # Ausfall mit Ansage. Der direkte Weg hat dieselbe Wirkung und weniger
  # bewegliche Teile.
  #
  # Blockierend, und das kann es sein: Ein Fund heißt entweder „echtes
  # Geheimnis im Repo" — dann ist Stoppen genau richtig — oder „neuer
  # Testwert", und der gehört mit Begründung in `.gitleaks.toml`.
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Die Historie mit: Ein Geheimnis, das einmal committet und im
          # nächsten Commit „entfernt" wurde, liegt weiterhin im Repo und
          # ist weiterhin kompromittiert.
          fetch-depth: 0
      - name: gitleaks installieren
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      # `--redact`: Findet der Job wirklich etwas, steht der Wert sonst im
      # Lauf-Protokoll — also an genau der Stelle, die jeder lesen kann.
      - name: Geheimnisse suchen
        run: gitleaks dir . --no-banner --redact -c .gitleaks.toml

  # Das Gegenstück zu dependency-review: Der prüft nur, was ein PR NEU
  # hinzufügt, und würde einen Lizenzwechsel in einer bestehenden
  # transitiven Abhängigkeit nie bemerken. Dieser Job prüft den GANZEN
  # Baum — Regeln und Begründungen in tool/license_config.yaml.
  #
  # `dart pub global activate` statt dev_dependency: `pubspec.yaml` zählt
  # hier zu den ausgelieferten Pfaden (Version Guard), eine Zeile dort
  # verlangte also einen Versions-Bump, nur um einen Linter zu installieren.
  #
  # **Blockierend.** In pilzbuddy stand hier zunächst `continue-on-error` —
  # und genau das hat den einzigen echten Fehler verdeckt, den der Job je
  # hatte: Der Aufruf war falsch (`license_checker:lic_ck`; `lic_ck` ist der
  # Name der INSTALLIERTEN Binärdatei, `dart pub global run` will aber den
  # SKRIPTnamen, und der ist `license_checker`). Exit 66, grüner Haken. Ein
  # Check, der Erfolg meldet, ohne etwas geprüft zu haben, ist schlechter
  # als gar keiner.
  #
  # Die Konfiguration ist gegen den echten Baum abgestimmt und rot
  # verifiziert; sie darf blockieren. Ein neues Paket mit unlesbarer Lizenz
  # macht CI dann rot und wird mit einem **nachgesehenen** Override in
  # tool/license_config.yaml beantwortet — das ist der vorgesehene Ablauf,
  # nicht der Ausnahmefall.
  licenses:
    name: Lizenzen (Gesamtbestand)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      # Die Pakete müssen im Cache liegen: Das Werkzeug liest die echten
      # LICENSE-Dateien, nicht irgendwelche Metadaten.
      - run: flutter pub get
      - run: dart pub global activate license_checker
      # `paket:skript`, NICHT `paket:binärname` — siehe Kopf.
      - name: Lizenzen prüfen
        run: dart pub global run license_checker:license_checker -c tool/license_config.yaml check-licenses
